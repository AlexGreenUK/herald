# Builds Herald (Alex build) on the shared Android runner (Forgejo machine, label "android"): unit tests and
# a release APK. Signed with the key the phones already have (repo secrets), so it installs over Herald.
name: android

on:
  push:
    branches: [alex-build]
  workflow_dispatch:

jobs:
  apk:
    runs-on: android
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: herald-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.XS_HERMES_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Secret XS_HERMES_KEYSTORE_B64 is missing"; exit 1; }
          mkdir -p ~/.android && echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
      - name: Build
        env:
          JAVA_HOME: /opt/jdk21
          ORG_GRADLE_JAVA_INSTALLATIONS_PATHS: /opt/jdk25,/opt/jdk21
        run: ./gradlew --no-daemon :androidApp:assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          for f in androidApp/build/outputs/apk/release/*.apk; do cp "$f" "out/herald-${GITHUB_SHA::7}-$(basename "$f")"; done
          rm -f ~/.android/debug.keystore
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: herald-apk
          path: out/*.apk
